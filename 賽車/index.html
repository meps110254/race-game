<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Giga Racer 3D - 酷幻極速霓虹對決</title>
    <!-- PWA configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #020205;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: radial-gradient(circle at center, #0f172a 0%, #020205 100%);
        color: #06b6d4;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .app-loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(6, 182, 212, 0.15);
        border-left-color: #06b6d4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Intercept global errors & unhandled rejections gracefully without triggering console.error alerts
      window.addEventListener('error', function (e) {
        console.warn('[Global Error Intercepted]', e.error || e.message);
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        console.warn('[Global Unhandled Rejection Intercepted]', e.reason);
        if (e) {
          if (typeof e.preventDefault === 'function') {
            e.preventDefault();
          }
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
        }
      }, true);
      window.onunhandledrejection = function (e) {
        console.warn('[Global Unhandled Rejection Handler]', e ? e.reason : '');
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }
        return true;
      };
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-loader-spinner"></div>
        <div style="font-size: 1.25rem; font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase;">GIGA RACER 3D</div>
        <div style="font-size: 0.85rem; color: #64748b; margin-top: 6px;">Initializing Engine & 3D Graphics...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration bypassed:', err);
          });
        });
      }
    </script>
  </body>
</html>
